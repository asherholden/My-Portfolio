<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>

    <link rel="stylesheet" href="./styles.css">

    <script src="app.js"></script>

</head>

<body>
  <nav>
        <div class="personal__logo">Asher Holden</div>
          <li class="nav__link">
            <a href="index.html" class="
              nav__link--anchor
              nav__link--anchor-primary
            ">Home</a>
          </li>
        </ul>
  </nav>

    
  <section class="contact">
          <div class="form__container">
            <div class="contact__card">
              <div class="contact__container">
                    <div class="contact__heading">
                      <h1>Contact Me</h1>
                      <p>Feel free to reach out! I'd love to hear from you.</p>
                    </div>
                    <form 
                    action="https://api.web3forms.com/submit" 
                    method="POST"
                    class="contact__form"
                    >
                      <input contact__box type="hidden" name="access_key" value="f17040d6-cacc-4411-b4cc-8acf9b6c6187">
                  
                      <input  class="contact__box" type="text" name="name" required placeholder="Name">
                     
                      <input class="contact__box" type="email" name="email" required placeholder="Email">
                  
                      <textarea class=" contact__box contact__box--textarea" name="message" required placeholder="Message" rows="5" cols="50" ></textarea>
                      <button class="contact__btn" type="submit">Submit Form</button>
                    </form>
              </div>
            </div>
        </div>
  </section>



      <footer>
      <div class="row footer__row">
        <a href="#" class="footer__anchor">
          <figure class="footer__logo">
            <img src="./assets/logo.png" class="footer__logo--img" alt="">
          </figure>
          <span class="footer__logo--popper">
            Top
            <i class="fas fa-arrow-up"></i>
          </span>
        </a>
        <div class="footer__social--list">
          <a href="https://github.com/asherholden" target="_blank" class="
            footer__social--link
            link__hover-effect
            link__hover-effect--white
          " target="_blank">GitHub</a>
          <a href="contact.html" target="_blank" class="
            footer__social--link
            link__hover-effect
            link__hover-effect--white
          " target="_blank">Contact</a>
        </div>
        <div class="footer__copyright">Copyright © 2026 Asher Holden</div>
      </div>
    </footer>
  </body>
</html>
